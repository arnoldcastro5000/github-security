name: Shell

# Module. Runs shellcheck on every shell script (*.sh, *.bash, and sh or bash shebang files
# without an extension). A finding fails the job. shellcheck writes no SARIF; read the log.
#
# Permissions come from the calling job: contents: read, plus security-events: write when
# upload-sarif is true (public repos only on GitHub Free).
# This workflow checks out github-security at its own commit (job.workflow_sha) for pins.env
# and the scan scripts.

on:
  workflow_call:
    inputs:
      working-directory:
        description: The directory to scan, relative to the repo root.
        type: string
        default: "."
      upload-sarif:
        description: Upload the reports to code scanning.
        type: boolean
        default: false

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the Baseline at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .baseline
          persist-credentials: false

      - name: Move the Baseline out of the workspace and load the pins
        run: |
          mv .baseline "$RUNNER_TEMP/baseline"
          grep -E '^[A-Z0-9_]+=' "$RUNNER_TEMP/baseline/pins.env" >> "$GITHUB_ENV"

      - name: Install tools
        run: '"$RUNNER_TEMP/baseline/scripts/install-tool.sh" shellcheck'

      - name: Scan
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: '"$RUNNER_TEMP/baseline/scripts/scan/shell.sh" "$WORKING_DIRECTORY"'

      - name: Summarize findings
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/baseline/scripts/sarif-summary.sh" "Shell" "$RUNNER_TEMP/baseline-out"'

      # Fork pull requests get a read-only token and cannot upload.
      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && inputs.upload-sarif && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/baseline-out
          category: baseline-shell
