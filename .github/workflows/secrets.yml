name: Secrets

# Baseline. Scans every commit for leaked secrets with gitleaks and betterleaks (default rules,
# the repo's .gitleaks.toml, and opted-in rule packs), then with trufflehog for verified live
# credentials. A finding fails the job.
#
# Permissions come from the calling job: contents: read, plus security-events: write when
# upload-sarif is true (public repos only on GitHub Free).
# This workflow checks out github-security at its own commit (job.workflow_sha) for pins.env,
# the scan scripts, and the rule packs.

on:
  workflow_call:
    inputs:
      rule-packs:
        description: Space-separated rule packs from config/rule-packs (for example "aws-account-ids").
        type: string
        default: ""
      upload-sarif:
        description: Upload the reports to code scanning.
        type: boolean
        default: false

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the Baseline at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .baseline
          persist-credentials: false

      - name: Move the Baseline out of the workspace and load the pins
        run: |
          mv .baseline "$RUNNER_TEMP/baseline"
          grep -E '^[A-Z0-9_]+=' "$RUNNER_TEMP/baseline/pins.env" >> "$GITHUB_ENV"

      - name: Install tools
        run: '"$RUNNER_TEMP/baseline/scripts/install-tool.sh" gitleaks betterleaks trufflehog'

      - name: Scan
        env:
          RULE_PACKS: ${{ inputs.rule-packs }}
        run: '"$RUNNER_TEMP/baseline/scripts/scan/secrets.sh" --mode git --rule-packs "$RULE_PACKS" .'

      - name: Summarize findings
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/baseline/scripts/sarif-summary.sh" "Secrets" "$RUNNER_TEMP/baseline-out"'

      # Fork pull requests get a read-only token and cannot upload.
      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && inputs.upload-sarif && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/baseline-out
          category: baseline-secrets
