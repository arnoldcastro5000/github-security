name: Terraform

# Module. Runs terraform fmt and validate (no backend, no cloud credentials), tflint,
# checkov, and trivy config (HIGH and CRITICAL). A finding fails the job.
#
# Permissions come from the calling job: contents: read, plus security-events: write when
# upload-sarif is true (public repos only on GitHub Free).
# This workflow checks out github-security at its own commit (job.workflow_sha) for pins.env
# and the scan scripts.

on:
  workflow_call:
    inputs:
      working-directory:
        description: The directory to scan, relative to the repo root.
        type: string
        default: "."
      upload-sarif:
        description: Upload the reports to code scanning.
        type: boolean
        default: false

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the Baseline at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .baseline
          persist-credentials: false

      - name: Move the Baseline out of the workspace and load the pins
        run: |
          mv .baseline "$RUNNER_TEMP/baseline"
          grep -E '^[A-Z0-9_]+=' "$RUNNER_TEMP/baseline/pins.env" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install tools
        run: '"$RUNNER_TEMP/baseline/scripts/install-tool.sh" tflint checkov trivy'

      - name: Scan
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          # tflint --init downloads plugins from GitHub; the token avoids the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/baseline/scripts/scan/terraform.sh" "$WORKING_DIRECTORY"'

      - name: Summarize findings
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/baseline/scripts/sarif-summary.sh" "Terraform" "$RUNNER_TEMP/baseline-out"'

      # Fork pull requests get a read-only token and cannot upload.
      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && inputs.upload-sarif && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/baseline-out
          category: baseline-terraform
